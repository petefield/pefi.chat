<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#151631">
    <title>Offline - Pefi Chat</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #101027; color: #f2f1ff; font-family: system-ui, sans-serif; }
        main { width: min(100%, 440px); padding: 36px; border: 1px solid #444066; border-radius: 22px; background: #181a37; }
        .icon { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 17px; background: #5545ae; font-size: 30px; }
        h1 { margin: 24px 0 12px; font-size: 26px; }
        p { color: #c3bfdc; line-height: 1.6; }
        a { display: inline-block; margin-top: 12px; padding: 12px 18px; border-radius: 10px; background: #624ec5; color: white; text-decoration: none; font-weight: 600; }
        a:focus-visible { outline: 3px solid #b7aaff; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <div class="icon" aria-hidden="true">#</div>
        <h1>You're offline</h1>
        <p>Pefi Chat needs an internet connection to sign in and send or read messages. Check your connection and try again.</p>
        <a href="/">Try again</a>
    </main>
</body>
</html>
